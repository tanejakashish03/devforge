name: Flask CI

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:latest

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Run Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            fs --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed --no-progress .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build --pull -t $REGISTRY/$IMAGE_NAME:latest .

      - name: Scan Docker image with Trivy
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$TRIVY_IMAGE" \
            image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed --no-progress "$REGISTRY/$IMAGE_NAME:latest"

      - name: Push Docker image
        if: github.event_name == 'push'
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker push $REGISTRY/$IMAGE_NAME:latest
