image: python:3.12

stages:
  - test
  - build

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements-dev.txt

test:
  stage: test
  script:
    - pytest

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t devforge-flask:gitlab .