image: node:24

stages:
  - test
  - build

before_script:
  - node --version
  - npm --version
  - npm ci

test:
  stage: test
  script:
    - npm test

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t devforge-node:gitlab .