global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "devforge-blue"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:5001"

  - job_name: "devforge-green"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:5002"
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "host.docker.internal:9100"
