---
- name: Configure DevForge EC2 server
  hosts: devforge
  become: true
  gather_facts: true

  vars_files:
    - vars.yml

  tasks:

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker
      ansible.builtin.apt:
        name: "{{ docker_package }}"
        state: present

    - name: Install NGINX
      ansible.builtin.apt:
        name: "{{ nginx_package }}"
        state: present

    - name: Ensure Docker is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure NGINX is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Create DevForge application directory
      ansible.builtin.file:
        path: /opt/devforge
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create DevForge deployment user
      ansible.builtin.user:
        name: devforge
        shell: /bin/bash
        create_home: true
        state: present

    - name: Verify Docker service
      ansible.builtin.command:
        cmd: systemctl is-active docker
      register: docker_status
      changed_when: false

    - name: Verify NGINX service
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_status
      changed_when: false

    - name: Display service status
      ansible.builtin.debug:
        msg:
          - "Docker status: {{ docker_status.stdout }}"
          - "NGINX status: {{ nginx_status.stdout }}"
          - "Server hostname: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Install git and curl
      ansible.builtin.apt:
        name: [git, curl]
        state: present

    - name: Let the ubuntu user run Docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create persistent data directory
      ansible.builtin.file:
        path: /opt/devforge/data
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create env file from GITHUB_TOKEN in your shell (never stored in git)
      ansible.builtin.copy:
        dest: /opt/devforge/devforge.env
        content: "GITHUB_TOKEN={{ lookup('env', 'GITHUB_TOKEN') }}\n"
        owner: root
        group: docker
        mode: '0640'
        force: false
      when: lookup('env', 'GITHUB_TOKEN') | length > 0
      no_log: true

    - name: Fetch latest DevForge code
      ansible.builtin.git:
        repo: https://github.com/tanejakashish03/devforge.git
        dest: /opt/devforge/repo
        version: master
        force: true
      become_user: ubuntu

    - name: Build image and start DevForge
      ansible.builtin.command: /opt/devforge/repo/scripts/deploy.sh
      become_user: ubuntu
