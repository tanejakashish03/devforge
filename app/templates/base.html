<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}DevForge{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<header class="navbar">

    <div class="logo">
        DevForge
    </div>

    <nav>
        <a href="{{ url_for('main.dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('projects.create_project') }}">
            Create Project
        </a>
    </nav>

</header>

<main class="container">

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
