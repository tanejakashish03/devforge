{% extends "base.html" %}

{% block title %}
Create Project
{% endblock %}

{% block content %}

<section class="form-section">

    <h1>Create New Project</h1>

    <p>
        Configure a new application for automated delivery.
    </p>


    <form
        method="POST"
        action="{{ url_for('projects.create_project') }}"
    >

        <div class="form-group">

            <label for="name">
                Project Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="my-application"
                required
            >

        </div>


        <div class="form-group">

            <label for="repository_name">
                Repository Name
            </label>

            <input
                type="text"
                id="repository_name"
                name="repository_name"
                placeholder="my-application"
                required
            >

        </div>


        <div class="form-group">

            <label for="application">
                Application
            </label>

            <select
                id="application"
                name="application"
            >

                <option value="flask">
                    Python Flask
                </option>

                <option value="fastapi">
                    Python FastAPI
                </option>

                <option value="node">
                    Node.js
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="visibility">
                Repository Visibility
            </label>

            <select
                id="visibility"
                name="visibility"
            >

                <option value="private">
                    Private
                </option>

                <option value="public">
                    Public
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="port">
                Application Port
            </label>

            <input
                type="number"
                id="port"
                name="port"
                value="5000"
                min="1"
                max="65535"
                required
            >

        </div>


        <div class="form-group">

            <label for="health_endpoint">
                Health Endpoint
            </label>

            <input
                type="text"
                id="health_endpoint"
                name="health_endpoint"
                value="/health"
                required
            >

        </div>


        <div class="form-group">

            <label for="environment">
                Environment
            </label>

            <select
                id="environment"
                name="environment"
            >

                <option value="development">
                    Development
                </option>

                <option value="staging">
                    Staging
                </option>

                <option value="production">
                    Production
                </option>

            </select>

        </div>


        <button
            type="submit"
            class="button"
        >
            Create Project
        </button>

    </form>

</section>

{% endblock %}
